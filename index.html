<!doctype html>
<html lang="en">
  <head>
    <!-- Charset & Viewport -->
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover"
    />

    <!-- Primary SEO -->
    <title>
      PacketNest — Interactive Network Simulator
    </title>

    <meta
      name="title"
      content="PacketNest — Interactive Network Simulator"
    />

    <meta
      name="description"
      content="PacketNest is a browser-based interactive network simulator inspired by Cisco Packet Tracer. Build topologies, configure routers and switches, run CLI commands, and simulate packet flow directly in your browser."
    />

    <meta
      name="keywords"
      content="PacketNest, network simulator, packet tracer, networking lab, Cisco simulator, router simulation, switch simulation, subnetting, ping simulation, networking education, React network simulator"
    />

    <meta name="author" content="PacketNest" />
    <meta name="robots" content="index, follow" />

    <!-- Theme -->
    <meta name="theme-color" content="#0B1020" />
    <meta name="color-scheme" content="dark light" />

    <!-- Canonical -->
    <link
      rel="canonical"
      href="https://packetnest.vercel.app/"
    />

    <!-- Favicon -->
    <link rel="icon" href="/favicon.ico" sizes="any" />
    <link rel="icon" type="image/png" href="/image.png" />
    <link rel="apple-touch-icon" href="/image.png" />

    <!-- Open Graph -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="PacketNest" />

    <meta
      property="og:title"
      content="PacketNest — Interactive Network Simulator"
    />

    <meta
      property="og:description"
      content="Build virtual network topologies, configure devices, and simulate packet flow in a modern browser-based networking lab."
    />

    <meta
      property="og:url"
      content="https://packetnest.vercel.app/"
    />

    <meta
      property="og:image"
      content="https://packetnest.vercel.app/og-image.jpg"
    />

    <meta
      property="og:image:alt"
      content="PacketNest Interactive Network Simulator"
    />

    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />

    <!-- Twitter / X -->
    <meta
      name="twitter:card"
      content="summary_large_image"
    />

    <meta
      name="twitter:title"
      content="PacketNest — Interactive Network Simulator"
    />

    <meta
      name="twitter:description"
      content="Modern browser-based network simulator with routers, switches, CLI commands, topology design, and packet animation."
    />

    <meta
      name="twitter:image"
      content="https://packetnest.vercel.app/og-image.jpg"
    />

    <!-- PWA / Mobile -->
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />

    <meta
      name="apple-mobile-web-app-status-bar-style"
      content="black-translucent"
    />

    <meta
      name="apple-mobile-web-app-title"
      content="PacketNest"
    />

    <!-- Performance -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="dns-prefetch" href="https://fonts.googleapis.com" />

    <!-- Manifest (optional future PWA support) -->
    <!-- <link rel="manifest" href="/manifest.webmanifest" /> -->

  </head>

  <body>
    <noscript>
      <strong>
        PacketNest requires JavaScript to run properly.
      </strong>
    </noscript>

    <div id="root"></div>

    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
